name: ci

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pytest marks
        run: pytest tests/test_marks.py -v --alluredir=allure-results
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for db
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/db-ping && exit 0
            sleep 2
          done
          exit 1
      - name: Pytest auth
        run: pytest tests/test_app_auth.py -v --alluredir=allure-results
      - name: Pytest orders
        run: pytest tests/test_orders.py -v --alluredir=allure-results
      - name: Stop app
        if: always()
        run: docker compose down
      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
